<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>6 Degrees — international school teacher network</title>
  <meta name="description" content="A relationship map for international school teachers, connected by shared place and time." />

  <!-- Third-party libs, CDN only (no bundler). Loaded as classic scripts so they attach
       global names (d3, maplibregl, deck) that the ES-module views read. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js" defer></script>
  <!-- MapLibre GL v5 (v4 has no globe projection; the globe toggle needs v5's setProjection). -->
  <link href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js" defer></script>
  <script src="https://unpkg.com/deck.gl@9.0.36/dist.min.js" defer></script>
  <!-- 3D force-directed network (Three.js bundled) for the Network view's 3D mode. Global: ForceGraph3D -->
  <script src="https://unpkg.com/3d-force-graph@1.80.0/dist/3d-force-graph.min.js" defer></script>

  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">6&deg;</span>
      <div class="brand-text">
        <h1>6&nbsp;Degrees</h1>
        <p>How international school teachers are connected by place &amp; time</p>
      </div>
    </div>
    <div class="header-ego" id="header-ego"></div>
  </header>

  <div class="app-body">
    <nav class="tab-nav" id="tab-nav" aria-label="Views"><!-- tabs injected by app.js --></nav>
    <main class="view-container" id="view-container">
      <div class="loading">Loading the community&hellip;</div>
    </main>
  </div>

  <div class="tooltip" id="tooltip" role="status" aria-live="polite"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
